[platformio]
;src_dir = .
src_dir = Core/Src
include_dir = Core/Inc

[env:stm32f411ccux]
platform = ststm32
board = genericSTM32F411CC
;board = blackpill_f411ce
upload_protocol = stlink
monitor_speed = 9600
framework = stm32cube

lib_extra_dirs = ../Core/libs/Controls
                ../Core/Business
                ../Embeded/Core/libs
                libs
                                  
build_flags = -I ../Core/libs/
              -I ../Core/libs/Controls
              -I libs                            
              
              